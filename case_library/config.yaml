# 국정 시뮬레이터 케이스 도서관 설정
government:
  name: 윤석열
  start: 2022-05-10
  end: 2025-04-04

collect:
  user_agent: "Mozilla/5.0 (compatible; PresidentGameResearchBot/0.1; non-commercial academic research on public opinion; contact: repository owner)"
  min_interval_sec: 2.5      # 요청 사이 최소 간격(초)
  timeout_sec: 60
  list_url: https://www.gallup.co.kr/gallupdb/report.asp
  content_url: https://www.gallup.co.kr/gallupdb/reportContent.asp?seqNo={seq}
  years: [2022, 2023, 2024, 2025]

baseline:
  # 후보 모델: log(취임 후 주 수 로그 감소), exp(지수 감소), loess(국소 회귀, frac = 전체 중 몇 %의 점으로 이웃을 잡을지)
  loess_fracs: [0.08, 0.1, 0.15, 0.2, 0.3, 0.5]
  cv_block_weeks: 8          # 교차검증 때 한 번에 빼는 연속 주 수
  # LOESS 창(이웃 점들이 걸치는 기간)이 이보다 짧으면 사건 효과까지 따라가므로 후보에서 뺀다.
  # 케이스 감지 창(최대 3주)의 5배.
  min_window_weeks: 15
  min_coverage: 0.9          # 직무 긍정률이 있는 주가 이 비율 이상인 집단만 기준선을 만든다

cases:
  windows: [1, 2, 3]          # 몇 번의 조사(주) 사이 변화를 볼지
  overall_z: 1.96             # 전체: |잔차 변화| > overall_z × 변화량 표준오차 이면 감지 (95%)
  group_moe_multiple: 2.0     # 집단: |잔차 변화| > group_moe_multiple × 집단 표본오차(±1.96×표준오차) 이면 감지
  moe_z: 1.96
  reason_change_pp: 3         # 같은 기간 이 이상 늘거나 준 평가 이유 항목을 카드에 싣는다
  recovery_z: 1.0             # 잔차가 기준 주 잔차와 (recovery_z × 변화량 표준오차) 안으로 돌아오면 '회복'

backtest:
  horizons: [1, 2]            # 케이스 시작 주 뒤 몇 번째 조사까지 예측할지
  k_analogs: 3                # 가장 비슷한 과거 케이스 몇 개를 평균할지
  min_similarity: 0.1         # 이보다 덜 비슷하면 유사 사례로 쓰지 않음
  noise_z: 1.0                # |변화| < noise_z × 변화량 표준오차 이면 방향 '변화 없음'으로 본다
